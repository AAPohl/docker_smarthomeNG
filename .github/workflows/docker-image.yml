name: Docker Image CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build Docker image
        run: |
          docker build \
            --file Dockerfile \
            --tag smarthomeng:latest \
            .

      - name: Inspect Docker image
        run: |
          docker image inspect smarthomeng:latest > /dev/null

      - name: Prepare test environment
        run: |
          set -euo pipefail

          mkdir -p tmpMnt
          mkdir -p tmpHtml

          git clone \
            --depth 1 \
            https://github.com/Martin-Gleiss/smartvisu.git \
            tmpHtml/smartvisu

      - name: Run SmartHomeNG container
        timeout-minutes: 2
        run: |
          set -euo pipefail

          docker run -d \
            --name smarthomeng-test \
            -v "$PWD/tmpMnt:/mnt" \
            -v "$PWD/tmpHtml:/mnt/html" \
            smarthomeng:latest

          echo "Waiting for SmartHomeNG startup..."
          sleep 60

      - name: Show container logs
        if: always()
        run: |
          docker logs smarthomeng-test || true

      - name: Validate SmartHomeNG startup
        run: |
          set -euo pipefail

          LOG="tmpMnt/data/log/smarthome-details.log"

          test -f "$LOG"

          echo "=== SmartHomeNG Log ==="
          cat "$LOG"

          grep -qF -- \
            "--------------------   SmartHomeNG initialization finished   --------------------" \
            "$LOG"

          if grep -Ei -- \
            "(Traceback|CRITICAL|Exception|ModuleNotFoundError|ImportError|ERROR)" \
            "$LOG"; then
            echo "Startup errors found"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: |
          docker rm -f smarthomeng-test 2>/dev/null || true
